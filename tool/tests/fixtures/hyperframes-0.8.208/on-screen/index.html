<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A made-up main video</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Josefin Sans"; src: url("assets/fonts/josefin-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Josefin Sans", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Made up, in the shape of the files the app wrote for A0 and A0b: a composition a host names, the host's own variables, a text in this file, the captions beside them. -->
    <div data-hf-id="hf-aa01"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="180"
      data-width="1920"
      data-height="1080"
    >
      <video data-hf-id="hf-vv01"
        id="a-roll"
        class="clip"
        src="media/recording.mp4"
        playsinline
        data-start="0"
        data-duration="180"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
        data-has-audio="true"
      >Your browser cannot play this video.</video>
      <div data-hf-id="hf-lt01"
        id="lower-third"
        data-composition-id="lower-third"
        data-composition-src="compositions/lower-third.html"
        data-start="3"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div data-hf-id="hf-tc01"
        id="title-card"
        data-composition-id="title-card"
        data-composition-src="compositions/title-card.html"
        class="clip"
        data-start="20"
        data-duration="3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"line1":"Three pricing","line2":"mistakes"}'
        style="z-index: 3"
      ></div>
      <div data-hf-id="hf-nt01"
        id="note"
        class="clip"
        data-start="40"
        data-duration="4"
        data-track-index="3"
        style="position: absolute; left: 160px; bottom: 120px; font-size: 56px; color: #fff"
      >Know your costs</div>
      <div data-hf-id="hf-ec01"
        id="end-card"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        class="clip"
        data-start="176"
        data-duration="4"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-cp01"
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        class="clip"
        data-start="0"
        data-duration="180"
        data-track-index="5"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
