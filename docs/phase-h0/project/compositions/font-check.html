<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"family","type":"string","label":"Typeface","description":"The font family to look for.","default":"Josefin Sans"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../brand.css" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--smoke);
        color: var(--navy);
        padding: 80px 120px;
        box-sizing: border-box;
      }
      #result {
        font-family: "Varela", sans-serif;
        font-size: 64px;
        padding: 18px 28px;
        display: inline-block;
        color: var(--smoke);
        background: #8a1c1c;
      }
      #result.found {
        background: #2e6b3a;
      }
      .sample {
        font-size: 64px;
        line-height: 1.35;
        letter-spacing: 0.02em;
      }
      .label {
        font-family: "Varela", sans-serif;
        font-size: 24px;
        color: var(--fog);
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <!-- Says whether the renderer can draw the family it is given (Josefin Sans, by default), by measuring
         the same words in that family with two different fallbacks: if both measure as their fallbacks do, the family was not
         found. The three weights are drawn too, for an eye to judge, and Varela from its file as the control. -->
    <div
      id="root"
      data-composition-id="font-check"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <div id="result">Checking</div>
      <div class="label">Light (300), in the family above, with monospace as its fallback</div>
      <div class="sample brand-text" style="font-weight: 300">The BRIMM: pricing, 0123</div>
      <div class="label">Regular (400)</div>
      <div class="sample brand-text" style="font-weight: 400">The BRIMM: pricing, 0123</div>
      <div class="label">Medium (500), capitals, letter spacing 0.10</div>
      <div class="sample brand-text" style="font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em">
        The BRIMM: pricing
      </div>
      <div class="label">Varela, from Google Fonts' file (the control: it should always be found)</div>
      <div class="sample" style="font-family: 'Varela', monospace">The BRIMM: pricing, 0123</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const family = vars.family || "Josefin Sans";
        await document.fonts.load('64px "Varela"');
        await document.fonts.ready;
        const words = "The BRIMM pricing 0123 mmmwwwlliiQ";
        const context = document.createElement("canvas").getContext("2d");
        const width = (font) => {
          context.font = font;
          return context.measureText(words).width;
        };
        const found = (name) =>
          width(`72px "${name}", monospace`) !== width("72px monospace") ||
          width(`72px "${name}", serif`) !== width("72px serif");
        const result = document.getElementById("result");
        const varela = found("Varela");
        const wanted = found(family);
        result.textContent = `${family}: ${wanted ? "FOUND" : "MISSING"}.  Varela: ${varela ? "FOUND" : "MISSING"}.`;
        if (wanted && varela) result.classList.add("found");
        const timeline = gsap.timeline({ paused: true });
        timeline.set({}, {}, 2);
        window.__timelines["font-check"] = timeline;
      })();
    </script>
  </body>
</html>
